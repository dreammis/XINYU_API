name: Import released public contracts

on:
  workflow_dispatch:
  repository_dispatch:
    types: [public-docs-updated]

permissions:
  contents: write

concurrency:
  group: docs-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Read only registered public documents
        env:
          DOCS_SOURCE_TOKEN: ${{ secrets.DOCS_SOURCE_TOKEN }}
        run: npm run docs:sync:remote
      - run: npm run docs:generate
      - run: npm run docs:check
      - run: npm test
      - name: Commit public documentation when changed
        run: |
          git add catalog gitbook functions/public-endpoints.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: sync released public API contracts'
          git push
