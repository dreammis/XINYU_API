name: Validate documentation site

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: docs-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check generated docs and OpenAPI
        run: npm run docs:check
      - name: Check aggregation behavior
        run: npm test
      - name: Build production site
        run: npm run build
      - name: Compile Pages debug function
        run: npx wrangler pages functions build --outdir .cache/functions
